<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5B21B6"/>
      <stop offset="100%" stop-color="#3730A3"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#EDE9FE"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" rx="22" fill="url(#bg)"/>
  <rect x="0" y="0" width="100" height="50" rx="22" fill="white" fill-opacity="0.04"/>

  <!-- Newspaper main sheet -->
  <rect x="18" y="18" width="46" height="60" rx="6" fill="url(#paper)"/>

  <!-- Newspaper fold corner -->
  <path d="M52 18 L64 30 L52 30 Z" fill="#DDD6FE"/>
  <path d="M52 18 L64 18 L64 30 Z" fill="#C4B5FD"/>

  <!-- Headline bar (big title) -->
  <rect x="24" y="25" width="22" height="5" rx="2" fill="#5B21B6"/>

  <!-- Sub-headline lines -->
  <rect x="24" y="34" width="34" height="2.5" rx="1.2" fill="#7C3AED" opacity="0.4"/>
  <rect x="24" y="39" width="28" height="2.5" rx="1.2" fill="#7C3AED" opacity="0.3"/>

  <!-- Divider -->
  <rect x="24" y="45" width="36" height="1" rx="0.5" fill="#C4B5FD" opacity="0.6"/>

  <!-- Text lines -->
  <rect x="24" y="49" width="36" height="2" rx="1" fill="#7C3AED" opacity="0.2"/>
  <rect x="24" y="54" width="32" height="2" rx="1" fill="#7C3AED" opacity="0.2"/>
  <rect x="24" y="59" width="36" height="2" rx="1" fill="#7C3AED" opacity="0.2"/>
  <rect x="24" y="64" width="20" height="2" rx="1" fill="#7C3AED" opacity="0.2"/>

  <!-- AI spark badge — overlapping bottom right -->
  <circle cx="72" cy="72" r="16" fill="url(#accent)"/>
  <circle cx="72" cy="72" r="16" fill="white" fill-opacity="0.08"/>

  <!-- Lightning bolt inside badge -->
  <path d="M75 60 L69 72 L73.5 72 L70 84 L78 70 L73 70 Z"
        fill="white" fill-opacity="0.95"/>
</svg>
