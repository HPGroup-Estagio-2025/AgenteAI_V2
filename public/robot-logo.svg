<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5B21B6"/>
      <stop offset="100%" stop-color="#4338CA"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" rx="22" fill="url(#bg)"/>
  <rect x="0" y="0" width="100" height="55" rx="22" fill="white" fill-opacity="0.05"/>

  <!-- Bold P letterform -->
  <path d="M22 18 L22 82 L34 82 L34 58
           C34 58 58 60 62 58
           C72 54 76 46 74 36
           C72 26 64 18 52 18 Z
           M34 28 L50 28
           C58 28 63 32 63 38
           C63 44 58 48 50 48
           L34 48 Z"
        fill="white"/>

  <!-- News lines inside the bowl of P -->
  <rect x="37" y="32" width="18" height="2.5" rx="1.2" fill="#7C3AED" opacity="0.5"/>
  <rect x="37" y="37" width="14" height="2.5" rx="1.2" fill="#7C3AED" opacity="0.4"/>
  <rect x="37" y="42" width="16" height="2.5" rx="1.2" fill="#7C3AED" opacity="0.3"/>

  <!-- Lines below the P bowl (article text) -->
  <rect x="22" y="60" width="30" height="2.5" rx="1.2" fill="white" opacity="0.25"/>
  <rect x="22" y="66" width="24" height="2.5" rx="1.2" fill="white" opacity="0.2"/>
  <rect x="22" y="72" width="28" height="2.5" rx="1.2" fill="white" opacity="0.15"/>

  <!-- Signal dot top-right -->
  <circle cx="76" cy="24" r="6" fill="white" fill-opacity="0.15"/>
  <circle cx="76" cy="24" r="3.5" fill="white" fill-opacity="0.9"/>
  <path d="M72 19 Q80 24 72 29" stroke="white" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.5"/>
  <path d="M70 16 Q82 24 70 32" stroke="white" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.3"/>
</svg>
