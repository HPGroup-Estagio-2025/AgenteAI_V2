<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4C1D95"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>
    <linearGradient id="paper" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EEF2FF"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" rx="20" fill="url(#bg)"/>

  <!-- Newspaper body -->
  <rect x="15" y="20" width="50" height="62" rx="5" fill="url(#paper)"/>

  <!-- Fold corner -->
  <path d="M51 20 L65 34 L51 34 Z" fill="#C4B5FD"/>
  <path d="M51 20 L65 20 L65 34 Z" fill="#A78BFA"/>

  <!-- Red breaking-news strip -->
  <rect x="15" y="26" width="36" height="8" rx="0" fill="#7C3AED"/>
  <rect x="15" y="26" width="36" height="8" rx="2" fill="#6D28D9"/>

  <!-- "NEWS" text suggestion — 4 tight bold bars -->
  <rect x="19" y="28.5" width="5" height="3" rx="1" fill="white"/>
  <rect x="26" y="28.5" width="5" height="3" rx="1" fill="white"/>
  <rect x="33" y="28.5" width="5" height="3" rx="1" fill="white"/>
  <rect x="40" y="28.5" width="7" height="3" rx="1" fill="white" opacity="0.6"/>

  <!-- Headline -->
  <rect x="20" y="39" width="32" height="4" rx="2" fill="#1E1B4B"/>
  <rect x="20" y="45" width="24" height="3" rx="1.5" fill="#3730A3" opacity="0.5"/>

  <!-- Divider -->
  <rect x="20" y="51" width="36" height="0.8" rx="0.4" fill="#C4B5FD" opacity="0.8"/>

  <!-- Body text lines -->
  <rect x="20" y="55" width="36" height="2.2" rx="1" fill="#6D28D9" opacity="0.18"/>
  <rect x="20" y="59.5" width="30" height="2.2" rx="1" fill="#6D28D9" opacity="0.18"/>
  <rect x="20" y="64" width="36" height="2.2" rx="1" fill="#6D28D9" opacity="0.18"/>
  <rect x="20" y="68.5" width="20" height="2.2" rx="1" fill="#6D28D9" opacity="0.18"/>

  <!-- Signal waves — top right, broadcasting -->
  <path d="M68 22 Q82 35 68 48" stroke="#C4B5FD" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M72 26 Q82 35 72 44" stroke="#A78BFA" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  <path d="M76 30 Q82 35 76 40" stroke="#7C3AED" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Source dot -->
  <circle cx="67" cy="35" r="3" fill="#7C3AED"/>
  <circle cx="67" cy="35" r="1.5" fill="white"/>
</svg>
