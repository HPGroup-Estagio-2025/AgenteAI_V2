<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Background -->
  <rect width="100" height="100" rx="22" fill="#7C3AED"/>
  <!-- Antenna -->
  <line x1="50" y1="10" x2="50" y2="22" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <circle cx="50" cy="8" r="4" fill="#A855F7"/>
  <!-- Head -->
  <rect x="27" y="22" width="46" height="34" rx="10" fill="white"/>
  <!-- Eyes -->
  <circle cx="40" cy="36" r="6" fill="#7C3AED"/>
  <circle cx="60" cy="36" r="6" fill="#7C3AED"/>
  <circle cx="41.5" cy="34.5" r="2" fill="white"/>
  <circle cx="61.5" cy="34.5" r="2" fill="white"/>
  <!-- Smile -->
  <path d="M39 47 Q50 54 61 47" stroke="#7C3AED" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Neck -->
  <rect x="44" y="56" width="12" height="6" rx="2" fill="white" opacity="0.8"/>
  <!-- Body -->
  <rect x="22" y="62" width="56" height="30" rx="10" fill="white" opacity="0.9"/>
  <!-- Laptop/screen on body -->
  <rect x="32" y="70" width="36" height="16" rx="4" fill="#7C3AED" opacity="0.8"/>
  <rect x="35" y="73" width="10" height="2" rx="1" fill="white" opacity="0.7"/>
  <rect x="35" y="77" width="16" height="2" rx="1" fill="white" opacity="0.5"/>
  <rect x="35" y="81" width="12" height="2" rx="1" fill="white" opacity="0.4"/>
  <!-- Publixy dot on screen -->
  <circle cx="55" cy="78" r="4" fill="#A855F7"/>
  <circle cx="55" cy="78" r="2" fill="white"/>
  <!-- Arms -->
  <rect x="8" y="64" width="14" height="8" rx="4" fill="white" opacity="0.8"/>
  <rect x="78" y="64" width="14" height="8" rx="4" fill="white" opacity="0.8"/>
</svg>
