<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6D28D9"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="body-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#EDE9FE"/>
    </linearGradient>
    <linearGradient id="eye-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#00000020"/>
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="100" height="100" rx="24" fill="url(#bg)"/>

  <!-- Subtle inner highlight -->
  <rect x="1" y="1" width="98" height="50" rx="23" fill="white" fill-opacity="0.06"/>

  <!-- Antenna base -->
  <rect x="47" y="12" width="6" height="14" rx="3" fill="white" fill-opacity="0.6"/>
  <!-- Antenna dot with glow -->
  <circle cx="50" cy="10" r="5" fill="#C4B5FD" filter="url(#glow)"/>
  <circle cx="50" cy="10" r="3" fill="white"/>

  <!-- Head -->
  <rect x="24" y="24" width="52" height="36" rx="12" fill="url(#body-grad)" filter="url(#shadow)"/>

  <!-- Eye left -->
  <rect x="31" y="32" width="16" height="14" rx="5" fill="url(#eye-grad)"/>
  <circle cx="36" cy="37" r="3" fill="white" fill-opacity="0.9"/>
  <circle cx="35" cy="36" r="1.2" fill="white"/>
  <!-- Eye shine left -->
  <circle cx="44" cy="33" r="1.5" fill="white" fill-opacity="0.4"/>

  <!-- Eye right -->
  <rect x="53" y="32" width="16" height="14" rx="5" fill="url(#eye-grad)"/>
  <circle cx="58" cy="37" r="3" fill="white" fill-opacity="0.9"/>
  <circle cx="57" cy="36" r="1.2" fill="white"/>
  <!-- Eye shine right -->
  <circle cx="66" cy="33" r="1.5" fill="white" fill-opacity="0.4"/>

  <!-- Mouth — subtle smile -->
  <path d="M38 51 Q50 57 62 51" stroke="#7C3AED" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.7"/>

  <!-- Neck -->
  <rect x="45" y="60" width="10" height="6" rx="3" fill="white" fill-opacity="0.5"/>

  <!-- Body -->
  <rect x="20" y="65" width="60" height="26" rx="12" fill="url(#body-grad)" fill-opacity="0.92" filter="url(#shadow)"/>

  <!-- Signal/broadcast icon on body -->
  <path d="M44 82 L50 72 L56 82" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <circle cx="50" cy="82.5" r="1.8" fill="#7C3AED"/>

  <!-- Side arcs (signal waves) -->
  <path d="M41 79 Q38 75.5 41 72" stroke="#A78BFA" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  <path d="M59 79 Q62 75.5 59 72" stroke="#A78BFA" stroke-width="1.8" stroke-linecap="round" fill="none"/>

  <!-- Arms -->
  <rect x="6" y="67" width="14" height="8" rx="4" fill="white" fill-opacity="0.55"/>
  <circle cx="20" cy="71" r="2.5" fill="#C4B5FD" fill-opacity="0.8"/>
  <rect x="80" y="67" width="14" height="8" rx="4" fill="white" fill-opacity="0.55"/>
  <circle cx="80" cy="71" r="2.5" fill="#C4B5FD" fill-opacity="0.8"/>
</svg>
